<script>
  const DATA = JSON.parse(document.getElementById('homeData').textContent)
  const { posts, navItems, catTabs, banners, announcements } = DATA

  const NAV_ICONS = { canteen: 'utensils-crossed', street: 'store', hospital: 'stethoscope', park: 'building-2', recruit: 'user-plus', biz: 'clipboard-list', shop: 'house', brand: 'tag', training: 'graduation-cap', sauce: 'soup' }
  const TAG_COLORS = ['bg-primary-soft text-primary', 'bg-accent-soft text-accent', 'bg-teal-50 text-teal-700', 'bg-sky-50 text-sky-700', 'bg-amber-50 text-amber-700']

  const state = { activeCat: 'all' }

  function formatNumber(num) {
    if (num >= 10000) return (num / 10000).toFixed(1) + '万'
    if (num >= 1000) return (num / 1000).toFixed(1) + 'k'
    return String(num)
  }

  function showToast(msg) {
    const t = document.getElementById('toast')
    document.getElementById('toastMsg').textContent = msg
    t.classList.remove('translate-y-2', 'opacity-0')
    t.classList.add('translate-y-0', 'opacity-100')
    clearTimeout(window.__tt)
    window.__tt = setTimeout(() => {
      t.classList.add('translate-y-2', 'opacity-0')
      t.classList.remove('translate-y-0', 'opacity-100')
    }, 1800)
  }

  // announcement
  const ann = announcements[0]
  document.getElementById('announcement').textContent = ann + '　　　' + ann

  // banner
  const bannerEl = document.getElementById('banner')
  bannerEl.innerHTML = banners.map((b, i) => `
    <div class="absolute inset-0 h-full w-full transition-opacity duration-700 ${i === 0 ? 'z-10 opacity-100' : 'z-0 opacity-0'}" data-banner="${i}">
      <img src="${b.img}" alt="${b.title}" class="h-full w-full object-cover" />
      <div class="absolute inset-0 bg-gradient-to-r from-primary/80 via-primary/30 to-transparent"></div>
      <div class="absolute inset-y-0 left-0 flex flex-col justify-center gap-1.5 p-5">
        <span class="w-fit rounded-md bg-accent px-2 py-0.5 text-[11px] font-semibold text-accent-foreground">精选活动</span>
        <h3 class="text-lg font-bold leading-tight text-white drop-shadow">${b.title}</h3>
        <p class="text-xs font-medium text-white/85">${b.subtitle}</p>
      </div>
    </div>`).join('') + `
    <div class="absolute bottom-2.5 left-1/2 z-20 flex -translate-x-1/2 gap-1.5" id="bannerDots"></div>`
  const dotsEl = document.getElementById('bannerDots')
  dotsEl.innerHTML = banners.map((b, i) => `<span class="h-1.5 rounded-full transition-all ${i === 0 ? 'w-5 bg-white' : 'w-1.5 bg-white/50'}" data-dot="${i}"></span>`).join('')
  let bIdx = 0
  function setBanner(i) {
    bIdx = i
    bannerEl.querySelectorAll('[data-banner]').forEach((el, j) => {
      el.className = `absolute inset-0 h-full w-full transition-opacity duration-700 ${j === i ? 'z-10 opacity-100' : 'z-0 opacity-0'}`
    })
    dotsEl.querySelectorAll('[data-dot]').forEach((el, j) => {
      el.className = `h-1.5 rounded-full transition-all ${j === i ? 'w-5 bg-white' : 'w-1.5 bg-white/50'}`
    })
  }
  dotsEl.querySelectorAll('[data-dot]').forEach((el, j) => el.addEventListener('click', () => setBanner(j)))
  setInterval(() => setBanner((bIdx + 1) % banners.length), 4000)

  // category nav
  document.getElementById('categoryNav').innerHTML = navItems.map(item => `
    <button type="button" class="group flex flex-col items-center gap-1.5" data-nav="${item.cat}">
      <span class="flex h-12 w-12 items-center justify-center rounded-xl bg-white ring-1 ring-border/60 transition-all group-hover:-translate-y-0.5 group-hover:shadow-md">
        <i data-lucide="${NAV_ICONS[item.cat] || 'utensils-crossed'}" class="h-6 w-6 text-primary"></i>
      </span>
      <span class="text-[11px] font-medium text-foreground">${item.label}</span>
    </button>`).join('')

  // category tabs
  function renderTabs() {
    document.getElementById('catTabs').innerHTML = catTabs.map(t => {
      const active = t.cat === state.activeCat
      return `<button type="button" data-tab="${t.cat}" class="relative shrink-0 whitespace-nowrap px-3 py-3 text-sm transition-colors ${active ? 'font-semibold text-primary' : 'text-muted-foreground'}">${t.label}<span class="absolute bottom-1.5 left-1/2 h-0.5 -translate-x-1/2 rounded-full bg-primary transition-all ${active ? 'w-5 opacity-100' : 'w-0 opacity-0'}"></span></button>`
    }).join('')
    document.querySelectorAll('[data-tab]').forEach(el => el.addEventListener('click', () => { state.activeCat = el.dataset.tab; renderTabs(); renderFeed() }))
  }

  function infoCard(post) {
    const avatarIdx = ((post.id - 1) % 6) + 1
    const tags = post.tags.map((t, i) => `<span class="rounded-md px-2 py-0.5 text-[11px] font-medium ${TAG_COLORS[i % TAG_COLORS.length]}">${t}</span>`).join('')
    const images = post.images.length ? `<div class="no-scrollbar mb-3 flex gap-2 overflow-x-auto">${post.images.map((img, i) => `<div class="h-24 w-32 shrink-0 overflow-hidden rounded-lg bg-muted"><img src="${img}" alt="${post.title}配图${i + 1}" class="h-full w-full object-cover" /></div>`).join('')}</div>` : ''

    const pinned = post.pinned ? `<span class="inline-flex items-center gap-0.5 rounded-md border border-accent/30 bg-accent-soft px-1.5 py-0.5 text-[10px] font-bold text-accent"><i data-lucide="pin" class="h-2.5 w-2.5"></i>置顶</span>` : ''
    return `
    <div class="cursor-pointer rounded-xl border border-border bg-card p-4 shadow-sm transition-all hover:-translate-y-0.5 hover:shadow-md" data-post="${post.id}">
      <div class="mb-3 flex items-center gap-2.5">
        <span class="h-9 w-9 shrink-0 overflow-hidden rounded-full ring-1 ring-border"><img src="/images/avatar${avatarIdx}.png" alt="${post.username}的头像" class="h-full w-full object-cover" /></span>
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-1.5"><span class="truncate text-sm font-semibold text-foreground">${post.username}</span>${verified}</div>
          <span class="text-[11px] text-muted-foreground">${post.publishDate}</span>
        </div>
        <span class="shrink-0 rounded-md bg-muted px-2 py-1 text-[11px] text-muted-foreground">${post.catLabel}</span>
      </div>
      <h3 class="mb-1.5 flex flex-wrap items-center gap-2 text-[15px] font-semibold leading-snug text-foreground"><span>${post.title}</span>${pinned}</h3>
      <p class="mb-2.5 line-clamp-2 text-[13px] leading-relaxed text-muted-foreground">${post.desc}</p>
      <div class="mb-2.5 flex flex-wrap gap-1.5">${tags}</div>
      <div class="mb-3 flex items-center gap-1 text-[11px] text-muted-foreground"><i data-lucide="map-pin" class="h-3.5 w-3.5"></i>${post.location}</div>
      ${images}
      <div class="flex items-center gap-6 border-t border-border pt-3 text-[12px] text-muted-foreground">
        <button type="button" data-like="${post.id}" class="flex items-center gap-1 ${post.userLiked ? 'font-semibold text-destructive' : ''}"><i data-lucide="heart" class="h-4 w-4" ${post.userLiked ? 'fill="currentColor"' : ''}></i>${post.likes}</button>
        <button type="button" data-fav="${post.id}" class="flex items-center gap-1 ${post.userFaved ? 'font-semibold text-accent' : ''}"><i data-lucide="star" class="h-4 w-4" ${post.userFaved ? 'fill="currentColor"' : ''}></i>${post.favorites}</button>
        <span class="flex items-center gap-1"><i data-lucide="eye" class="h-4 w-4"></i>${post.views}</span>
        <button type="button" data-share="${post.id}" class="flex items-center gap-1"><i data-lucide="share-2" class="h-4 w-4"></i>转发 ${post.shares}</button>
      </div>
      <button type="button" data-detail="${post.id}" class="mt-3 w-full rounded-lg bg-primary-soft py-2.5 text-sm font-semibold text-primary transition-colors hover:bg-primary hover:text-primary-foreground">查看详情</button>
    </div>`
  }

  function adCard(position) {
    return `
    <button type="button" data-ad="${position}" class="relative block w-full overflow-hidden rounded-xl border border-border shadow-sm transition-all hover:-translate-y-0.5 hover:shadow-md">
      <img src="/images/ad-banner.png" alt="广告" class="h-24 w-full object-cover" />
      <span class="absolute left-2 top-2 rounded-md bg-black/45 px-1.5 py-0.5 text-[10px] font-medium text-white">广告</span>
      <span class="absolute inset-y-0 left-4 flex flex-col justify-center gap-1 text-left">
        <span class="text-sm font-bold text-primary">精选推荐</span>
        <span class="text-[11px] font-medium text-accent">立即了解 ›</span>
      </span>
    </button>`
  }

  function renderStats(list) {
    const totalPosts = list.length
    const totalViews = list.reduce((s, i) => s + (i.views || 0), 0)
    const totalUsers = Math.floor(totalPosts * 128 + totalViews / 5)
    const stat = (label, value) => `<span class="inline-flex items-baseline gap-0.5 text-xs text-muted-foreground">${label}：<span class="font-mono text-sm font-bold text-primary">${formatNumber(value)}</span></span>`
    document.getElementById('statsBar').innerHTML = stat('用户量', totalUsers) + stat('发布量', totalPosts) + stat('浏览量', totalViews)
  }

  function renderFeed() {
    let data = state.activeCat === 'all' ? posts : posts.filter(d => d.cat === state.activeCat)
    data = [...data].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0))
    renderStats(data)
    const feed = document.getElementById('feed')
    if (!data.length) {
      feed.innerHTML = `<div class="flex flex-col items-center gap-2 py-16 text-muted-foreground"><span class="text-sm">没有找到相关信息</span></div>`
    } else {
      feed.innerHTML = data.map((post, idx) => {
        let html = `<div class="flex flex-col gap-3">${infoCard(post)}`
        if ((idx + 1) % 5 === 0 && idx + 1 < data.length) html += adCard(idx + 1)
        return html + '</div>'
      }).join('')
    }
    bindFeedEvents()
    lucide.createIcons()
  }

  function bindFeedEvents() {
    document.querySelectorAll('[data-like]').forEach(el => el.addEventListener('click', e => {
      e.stopPropagation()
      const p = posts.find(x => x.id == el.dataset.like)
      p.userLiked = !p.userLiked; p.likes += p.userLiked ? 1 : -1; renderFeed()
    }))
    document.querySelectorAll('[data-fav]').forEach(el => el.addEventListener('click', e => {
      e.stopPropagation()
      const p = posts.find(x => x.id == el.dataset.fav)
      p.userFaved = !p.userFaved; p.favorites += p.userFaved ? 1 : -1; renderFeed()
    }))
    document.querySelectorAll('[data-share]').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); showToast(`转发帖子 #${el.dataset.share}`) }))
    document.querySelectorAll('[data-detail]').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); showToast(`查看详情 #${el.dataset.detail}`) }))
    document.querySelectorAll('[data-post]').forEach(el => el.addEventListener('click', () => showToast(`查看详情 #${el.dataset.post}`)))
    document.querySelectorAll('[data-ad]').forEach(el => el.addEventListener('click', () => showToast(`广告位 #${el.dataset.ad / 5} — 点击跳转广告详情`)))
  }

  // nav click filters
  document.querySelectorAll('[data-nav]').forEach(el => el.addEventListener('click', () => {
    state.activeCat = el.dataset.nav
    renderTabs(); renderFeed()
    document.getElementById('catTabs').scrollIntoView({ behavior: 'smooth', block: 'start' })
  }))

  // back to top
  const scrollArea = document.getElementById('scrollArea')
  const btt = document.getElementById('backToTop')
  scrollArea.addEventListener('scroll', () => {
    if (scrollArea.scrollTop > 400) { btt.classList.remove('opacity-0', 'pointer-events-none') }
    else { btt.classList.add('opacity-0', 'pointer-events-none') }
  }, { passive: true })
  btt.addEventListener('click', () => scrollArea.scrollTo({ top: 0, behavior: 'smooth' }))

  renderTabs()
  renderFeed()
  lucide.createIcons()
</script>
</body>
</html>
